name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push to a PR cancels the stale run — four of six jobs on a three-fixup PR
# would otherwise verify commits nobody merges, with the slow Windows leg queueing behind
# itself. Pushes to main always run to completion: main is where both platforms' verdicts
# are wanted on every commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Both platforms, because a green Ubuntu run says nothing about the two things that
    # differ: path separators and line endings. Both have already produced a defect the
    # source project could not see on one platform alone.
    #
    # `engines.node` declares three supported ranges (`^22.22.2 || ^24.15.0 || >=26.0.0`);
    # `tests/build/engines.test.ts` only checks that every installed package's own
    # `engines.node` fits inside that declaration — it cannot see a runtime break on a
    # range this suite never actually executes on. So all three ride here: a declared
    # range nobody executes is the same defect `engines.node` itself exists to catch,
    # moved to a different file. A full OS x Node cross product (6 jobs) is more than
    # this earns, so 24 and 26 ride the faster Ubuntu leg only rather than tripling the
    # slow Windows one; Windows still runs the floor.
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg reports. A cancelled sibling is a leg whose result nobody has, and the
      # question this matrix exists to answer is exactly which platform/version failed.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-latest
            node: "26"
          - os: windows-latest
            node: "22"
    steps:
      - uses: actions/checkout@v7

      # Three conditional steps, not one `node-version: ${{ matrix.node }}`, because
      # `tests/release/manifest.test.ts` reads every literal `node-version: "..."` in
      # this file and asserts the `engines.node` floor is among them — a templated value
      # is plain expression text with no surrounding quotes, so it would be invisible to
      # that scan and would silently drop this job's floor pin from what the test can
      # see. Each leg's version is a literal quoted string for that reason.
      - uses: actions/setup-node@v7
        if: ${{ matrix.node == '22' }}
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-node@v7
        if: ${{ matrix.node == '24' }}
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-node@v7
        if: ${{ matrix.node == '26' }}
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # THE definition of done, verbatim — the same `npm run check` a commit must pass
      # locally, not a re-enumeration of its steps that could silently drift from it the
      # day `check` changes. Which gate failed is still in the log: npm prints each
      # sub-command as it runs.
      - name: Definition of done (npm run check)
        run: npm run check

  # Its own job, never a step in `verify`. `npm run check` is the offline definition of
  # done and every step in it can be satisfied by the commit being written; an advisory
  # can be published with no patched version, which is a red nobody can clear. Keeping it
  # separate means a merge waits on it while a local `check` never does, and the two
  # failures read differently because they are different.
  #
  # One platform, because an advisory is a fact about the dependency tree and the
  # lockfile is the same on both. `--omit=dev` scopes it to what actually ships.
  #
  # `npm run audit` runs at `--audit-level=high`, not `critical`: a high-severity advisory
  # in a shipped dependency was passing this job silently before. `high` still leaves the
  # "no patched version" red-nobody-can-clear failure mode out of `npm run check` — that
  # reasoning is what keeps `audit` its own job rather than a `check` step — while no
  # longer treating a high-severity, unpatched-shipped-dependency advisory as invisible.
  # Verified safe to raise now: `npm audit --omit=dev --audit-level=high` and
  # `npm audit --audit-level=high` (full tree) both report 0 vulnerabilities.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No install: `npm audit` reads package-lock.json and asks the registry — it never
      # touches node_modules, so an `npm ci` here would be a minute of work whose output
      # nothing reads.
      - name: Audit what ships
        run: npm run audit
