		<title>Renovation Planner — harness</title>
		<!-- An empty icon, so a browser does not fetch /favicon.ico on its own: that request
		     404s (there is no such file), and `scripts/harness-shot.mjs` treats a console
		     error as a real one — the failure this page should be caught making, not one a
		     bare `<head>` invites from every browser that opens it. -->
		<link rel="icon" href="data:," />
		<!--
			The ORDER is load-bearing.

			Obsidian's real app.css first, so real element defaults — button chrome included —
			are what the plugin's own resets have to strip, exactly as in a vault. Then the
			harness's own chrome, which may restate nothing app.css already says. Then the
			plugin's assembled stylesheet, served from styles/ by scripts/vite-assembled-styles.mjs.
		-->
		<link rel="stylesheet" href="./obsidian.css" />
		<link rel="stylesheet" href="./theme.css" />
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<script type="module" src="./page.ts"></script>
	</body>
</html>
